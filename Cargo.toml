[package]
name = "pocket-pixel"
version = "0.1.0"
edition = "2024"
description = "Text-first pixel art tools for humans and agents"
repository = "https://github.com/sontuphan/pocket-pixel"
license = "MIT"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
